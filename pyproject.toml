[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hamilton-core"
version = "0.1.0"
description = "Specification-gated development with enforced verification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Sebastian Greshake", email = "sebastian.greshake@d5software.de" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/hamilton-toolkit/core"
Repository = "https://github.com/hamilton-toolkit/core"
Issues = "https://github.com/hamilton-toolkit/core/issues"

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
hamilton = "hamilton_core.cli:main"

[tool.setuptools]
packages = ["hamilton_core"]

[tool.setuptools.package-data]
hamilton_core = [
    "templates/*",
    "templates/*/*",
    "templates/*/*/*",
    "templates/*/*/*/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures"]
